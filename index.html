<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <header>
            <h1>🎯 Aim Trainer</h1>

            <div class="stats">
                <div>
                    <span>Time</span>
                    <strong id="time">30</strong>
                </div>

                <div>
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span>Accuracy</span>
                    <strong id="accuracy">100%</strong>
                </div>
            </div>
        </header>

        <main id="game-area">
            <div id="start-screen">
                <h2>Ready?</h2>
                <p>Click as many targets as you can in 30 seconds!</p>
                <button id="start-btn">Start Game</button>
            </div>

            <button id="target"></button>

            <div id="game-over">
                <h2>Game Over!</h2>

                <p>Score: <strong id="final-score">0</strong></p>
                <p>Accuracy: <strong id="final-accuracy">0%</strong></p>
                <p>Clicks: <strong id="final-clicks">0</strong></p>

                <button id="retry-btn">🔄 Retry</button>
            </div>
        </main>

        <p class="hint">Click the targets as quickly as possible!</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
